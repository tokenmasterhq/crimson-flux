[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "crimson-flux"
version = "0.1.0"
description = "Local Xiaohongshu public-note collector with Web and CLI exports"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "CrimsonFlux contributors" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "qrcode[pil]==8.2",
  "typer>=0.15,<1",
  "uvicorn>=0.30,<1",
  "xhshow==0.2.0",
]

[project.optional-dependencies]
bootstrap = [
  "hatchling==1.27.0",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
crimsonflux = "xhs_insight.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_insight"]
artifacts = [
  "src/xhs_insight/web/templates/**",
  "src/xhs_insight/web/static/**",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
